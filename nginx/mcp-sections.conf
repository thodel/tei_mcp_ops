    # ── SSRQ MCP and friends — generated, all six streamable HTTP ──
    include /etc/nginx/snippets/mcp-atr.conf;
    include /etc/nginx/snippets/mcp-wd-pre1500.conf;

    location /mcp/ssrq/mcp {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_pass http://127.0.0.1:8002;
        proxy_redirect off;
    }
    location /mcp/ssrq {
        return 302 /mcp/ssrq/landing;
    }
    location /mcp/ssrq/landing {
        alias /var/www/html/ssrq-landing.html;
        default_type text/html;
    }
