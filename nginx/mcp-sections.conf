    # atr-results: read-only view of the ATR training programme (UBELIX + asteraix).
    # Upstream is the MCP on asteraix, reached through mcp-tunnel-asteraix@8013
    # (dh user unit) -> 127.0.0.1:8013 here. Mounted at its public path on the
    # upstream (--path /mcp/atr-results/mcp), so proxy_pass carries no URI part.
    # Key: auth_basic, user atr-results (training-atr-models#214, A4).
    location /mcp/atr-results/mcp {
        auth_basic           "atr-results";
        auth_basic_user_file /etc/nginx/.htpasswd-atr-results;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_pass http://127.0.0.1:8013;
        proxy_redirect off;
    }
